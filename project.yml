name: JARVIS
options:
  bundleIdPrefix: com.sohail
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""          # set your Team in Xcode (Signing & Capabilities) or put your Team ID here
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic   # lets `agvtool new-version -all` set every target together
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  JARVIS:
    type: application
    platform: iOS
    scheme:               # shared scheme so CI (Codemagic) can build it
      testTargets:
        - JARVISVoiceTests
    sources:
      - path: JARVIS
        includes:
          - "**/*.swift"
          - "**/*.metal"
          - "Assets.xcassets"
          - "Assets.xcassets/**"
          - "Resources/Startup/**"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sohail.jarvis
        PRODUCT_NAME: JARVIS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: JARVIS
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    info:
      path: JARVIS/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Filled at TestFlight time from the Codemagic variable JARVIS_APP_TOKEN. Empty in git.
        JarvisAppToken: ""
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - audio
          - remote-notification
        NSFaceIDUsageDescription: "JARVIS uses Face ID to unlock the home screen."
        NSMicrophoneUsageDescription: "JARVIS listens to your voice so it can answer your questions."
        NSCameraUsageDescription: "JARVIS uses the camera when you ask what it sees."
        NSPhotoLibraryUsageDescription: "JARVIS attaches a photo when you ask about it."
        NSPhotoLibraryAddUsageDescription: "JARVIS saves pictures it makes into your photo library."
        NSSpeechRecognitionUsageDescription: "JARVIS converts your speech to text on your iPhone so it can understand you."
        NSLocationWhenInUseUsageDescription: "JARVIS uses your location while the app is open, so the weather and places near you are about where you actually are."
        NSMotionUsageDescription: "JARVIS checks whether you are driving so a call from me stays short."
        NSContactsUsageDescription: "JARVIS looks up contacts when you ask it to call, FaceTime or message someone, and adds its own contact card."
        NSCalendarsFullAccessUsageDescription: "JARVIS reads and edits your calendar events when you ask it to."
        NSRemindersFullAccessUsageDescription: "JARVIS reads, creates and completes reminders when you ask it to."
        NSAppleMusicUsageDescription: "JARVIS plays music from your library when you ask it to."
        LSApplicationQueriesSchemes:
          - instagram
          - tiktok
          - snssdk1233
          - snapchat
          - whatsapp
          - youtube
          - spotify
          - twitter
          - comgooglemaps
          - maps
          - music
          - shortcuts
          - facetime
          - facetime-audio
          - message
          - tel
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: com.sohail.jarvis
            CFBundleURLSchemes: [jarvis]
    entitlements:
      path: JARVIS/JARVIS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sohail.jarvis
        aps-environment: production   # TestFlight. The App ID needs the Push Notifications capability.
    dependencies:
      - target: JARVISWidgets
        embed: true
  JARVISVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JARVISVoiceTests
    dependencies:
      - target: JARVIS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sohail.jarvis.voice-tests
        PRODUCT_NAME: JARVISVoiceTests
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
  JARVISWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: JARVISWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sohail.jarvis.widgets
        PRODUCT_NAME: JARVISWidgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: JARVISWidgets/Info.plist
      properties:
        CFBundleDisplayName: JARVIS Widgets
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: JARVISWidgets/JARVISWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sohail.jarvis
