name: Deploy JARVIS backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run

      - name: Require a real D1 database id
        run: |
          if grep -q "00000000-0000-0000-0000-000000000000" wrangler.toml; then
            echo "Replace database_id in backend/wrangler.toml with the id printed by: npx wrangler d1 create jarvis-db"
            exit 1
          fi

      - name: Apply D1 schema
        run: npx wrangler d1 execute jarvis-db --remote --file=./schema.sql --yes

      - name: Deploy Worker
        run: npx wrangler deploy
