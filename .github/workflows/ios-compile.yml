name: iOS compile

on:
  push:
    branches:
      - cursor/inbound-call-screening-afd7
      - main
    paths:
      - "JARVIS/**"
      - "JARVISWidgets/**"
      - "JARVISVoiceTests/**"
      - "Shared/**"
      - "project.yml"
      - ".github/workflows/ios-compile.yml"
  workflow_dispatch:

jobs:
  compile:
    name: Compile JARVIS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Compile for the iOS Simulator
        run: |
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Voice turn fixtures
        run: |
          set -euo pipefail
          DEST_LINE=$(xcodebuild -project JARVIS.xcodeproj -scheme JARVIS -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | grep -v placeholder \
            | head -1 || true)
          echo "Destination: ${DEST_LINE}"
          ID=$(printf '%s\n' "$DEST_LINE" | sed -n 's/.*id:\([^,]*\),.*/\1/p')
          if [ -z "$ID" ]; then
            echo "No iPhone simulator destination"
            xcodebuild -project JARVIS.xcodeproj -scheme JARVIS -showdestinations || true
            exit 1
          fi
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -destination "platform=iOS Simulator,id=${ID}" \
            -configuration Debug \
            -only-testing:JARVISVoiceTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test
