workflows:
  ios-testflight:
    name: JARVIS iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key you add in Codemagic (Teams > Integrations).
      app_store_connect: CODEMAGIC_ASC_KEY
    environment:
      groups:
        - signing
      vars:
        XCODE_PROJECT: "JARVIS.xcodeproj"
        XCODE_SCHEME: "JARVIS"
        APP_STORE_APPLE_ID: 6822971465   # numeric Apple ID of the app (App Store Connect > App Information)
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Install Metal toolchain
        script: |
          # Xcode 26 does not include the Metal compiler until this component is downloaded.
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -f metal || xcodebuild -showComponent MetalToolchain
      - name: Set up keychain to be used for code signing using Codemagic CLI 'keychain' command
        script: keychain initialize
      - name: Fetch signing files
        script: |
          # CODEMAGIC_ASC_KEY supplies APP_STORE_CONNECT_ISSUER_ID,
          # APP_STORE_CONNECT_KEY_IDENTIFIER, and APP_STORE_CONNECT_PRIVATE_KEY.
          # CERTIFICATE_PRIVATE_KEY is the PEM RSA key in the "signing" variable group.
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is not set. Add the PEM RSA private key to the Codemagic variable group 'signing'."
            exit 1
          fi
          app-store-connect fetch-signing-files "com.sohail.jarvis" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          app-store-connect fetch-signing-files "com.sohail.jarvis.widgets" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Increment build number
        script: |
          # A build still processing is invisible to get-latest-testflight-build-number,
          # so "latest + 1" can repeat a number App Store Connect already has (409).
          # $BUILD_NUMBER is Codemagic's own counter and only increases. Never go below
          # the latest TestFlight build + 1, in case that store number is already higher.
          cd "$CM_BUILD_DIR"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          LATEST=$(printf '%s' "$LATEST" | tr -dc '0-9')
          if [ -z "$LATEST" ]; then
            LATEST=0
          fi
          FLOOR=$((LATEST + 1))
          COUNTER=${BUILD_NUMBER:-0}
          if [ "$COUNTER" -gt "$FLOOR" ]; then
            NEXT=$COUNTER
          else
            NEXT=$FLOOR
          fi
          echo "CFBundleVersion $NEXT (BUILD_NUMBER=$COUNTER, TestFlight latest=$LATEST, floor=$FLOOR)"
          agvtool new-version -all "$NEXT"
          # agvtool updates every target build setting. Write the same literal into both
          # plists so the app and the widget extension cannot ship different CFBundleVersions.
          for PLIST in JARVIS/Info.plist JARVISWidgets/Info.plist; do
            if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" "$PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEXT" "$PLIST"
            fi
            echo "$PLIST CFBundleVersion=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")"
          done
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Separate from JARVIS. Internal TestFlight only: the IPA is marked
  # testFlightInternalTestingOnly, so Apple will not accept it for external
  # testing or App Store distribution. Do not add beta_groups, copyright,
  # release_type, or submit_to_app_store: true.
  asghq-testflight:
    name: ASG HQ iOS - TestFlight internal only
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: CODEMAGIC_ASC_KEY
    environment:
      groups:
        - signing
      vars:
        XCODE_PROJECT: "ASG-HQ/ASGHQ.xcodeproj"
        XCODE_SCHEME: "ASGHQ"
        BUNDLE_ID: "com.sohail.asghq"
        XCODE_PROJECT_CUSTOM_EXPORT_OPTIONS: '{"testFlightInternalTestingOnly": true}'
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$CM_BUILD_DIR/ASG-HQ"
          xcodegen generate
      - name: Set up keychain to be used for code signing using Codemagic CLI 'keychain' command
        script: keychain initialize
      - name: Fetch signing files
        script: |
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is not set. Add the PEM RSA private key to the Codemagic variable group 'signing'."
            exit 1
          fi
          app-store-connect fetch-signing-files "com.sohail.asghq" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/ASG-HQ/ASGHQ.xcodeproj" \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'
      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ASG-HQ"
          APPLE_ID="${ASGHQ_APP_STORE_APPLE_ID:-}"
          LATEST=0
          if [ -n "$APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APPLE_ID" || echo 0)
            LATEST=$(printf '%s' "$LATEST" | tr -dc '0-9')
          else
            echo "ASGHQ_APP_STORE_APPLE_ID is not set. Using Codemagic BUILD_NUMBER only."
            echo "Create the App Store Connect record for com.sohail.asghq for internal TestFlight only. Do not submit it for App Review. Then add the numeric Apple ID to the signing group as ASGHQ_APP_STORE_APPLE_ID."
          fi
          if [ -z "$LATEST" ]; then
            LATEST=0
          fi
          FLOOR=$((LATEST + 1))
          COUNTER=${BUILD_NUMBER:-1}
          if [ "$COUNTER" -gt "$FLOOR" ]; then
            NEXT=$COUNTER
          else
            NEXT=$FLOOR
          fi
          echo "CFBundleVersion $NEXT (BUILD_NUMBER=$COUNTER, TestFlight latest=$LATEST, floor=$FLOOR)"
          agvtool new-version -all "$NEXT"
          PLIST="$CM_BUILD_DIR/ASG-HQ/ASGHQ/Info.plist"
          if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $NEXT" "$PLIST"
          fi
          echo "Info.plist CFBundleVersion=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")"
      - name: Build ipa for internal TestFlight
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ASG-HQ/ASGHQ.xcodeproj" \
            --scheme "ASGHQ"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
