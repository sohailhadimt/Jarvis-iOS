# JARVIS cloud backend. Free-tier Cloudflare Workers + D1 + Cron Triggers.
# database_id is jarvis-db. The deploy workflow also looks this database up by name.
name = "jarvis-backend"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The work queue lives in D1 (see README). KV and Queues are not bound:
# the Workers KV free tier allows very few writes per day, and this worker
# must persist a step on every tick.

[[d1_databases]]
binding = "DB"
database_name = "jarvis-db"
database_id = "432f8531-b090-4df4-ad1d-efe720693d86"

[triggers]
crons = ["*/5 * * * *"]

[vars]
ENVIRONMENT = "production"
