# JARVIS cloud backend. Free-tier Cloudflare Workers + D1 + Cron Triggers.
# database_id is jarvis-db. The deploy workflow also looks this database up by name.
name = "jarvis-backend"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The work queue lives in D1 (see README). KV and Queues are not bound:
# the Workers KV free tier allows very few writes per day, and this worker
# must persist a step on every tick.

[[d1_databases]]
binding = "DB"
database_name = "jarvis-db"
database_id = "432f8531-b090-4df4-ad1d-efe720693d86"

# Agent lanes call this same Worker so each step gets a fresh invocation (see src/lanes.ts).
# To turn parallel agents off, delete these three lines.
[[services]]
binding = "SELF"
service = "jarvis-backend"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "production"
ELEVENLABS_FORCE_POLLY = "false"
# Agents working at the same time (1-6).
AGENT_LANES = "3"
# In-app voice agent. Not a secret: the agent requires a signed URL, which only the Worker can mint.
ELEVENLABS_APP_AGENT_ID = "agent_3901m7bmxyc0f19b1q1myy2cmxxy"
